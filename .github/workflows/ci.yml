name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution (Release)
        run: dotnet build FireBrick.sln -c Release --nologo

      - name: Run unit tests
        run: dotnet test tests/FireBrick.Tests/FireBrick.Tests.csproj -c Release --no-build --nologo
